# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        #cache: maven
    
    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
            ${{ runner.os }}-maven-

    - name: Build with Maven
      #run: mvn -B package --file pom.xml
      run: mvn clean package     #add -DskipTests to skip test cases.

     #Install Snyk is might not require, check 
    #- name: Install Snyk CLI
      #run: |
        #curl -sL https://snyk.io/install.sh | bash
        #snyk --version

    - name: Run Snyk to check for vulnerabilities (Fail on High severity)
      #run: |
        #snyk auth $SNYK_TOKEN
        #snyk test --severity-threshold=high --json > snyk-report.json
      uses: snyk/actions/maven@master
      with:    #with can not be used with run, so commenting with attribute and its dependencies.
        command: monitor
        args: test --severity-threshold=high      #This will run snyk test on every push and pull request to main.
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      
    - name: Generate HTML Report
      run: |
        npm install -g snyk-to-html
        snyk-to-html -i snyk-report.json -o snyk-report.html     #Converts JSON output into a readable HTML report.

      
    - name: Upload HTML Report as Artifact
      uses: actions/upload-artifact@v4    #you can download the report from the GitHub Actions run.
      with:
          name: snyk-html-report


